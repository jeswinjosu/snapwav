plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set them as GitHub Actions secrets):
//   SNAPWAV_KEYSTORE (path to .jks), SNAPWAV_KEYSTORE_PASSWORD, SNAPWAV_KEY_ALIAS, SNAPWAV_KEY_PASSWORD
// Without them, the release build is signed with the debug key so it still installs.
def ks = System.getenv('SNAPWAV_KEYSTORE')

android {
    namespace 'io.github.snapwav'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.snapwav'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SNAPWAV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SNAPWAV_KEY_ALIAS')
                keyPassword System.getenv('SNAPWAV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
